[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
name = "nextstat-cli"
version = "0.10.1"
description = "NextStat CLI — statistical fitting, hypothesis testing, and reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later OR LicenseRef-Commercial" }
authors = [{ name = "NextStat Contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://nextstat.io"
Documentation = "https://nextstat.io/docs/cli"

[tool.maturin]
bindings = "bin"
manifest-path = "../../crates/ns-cli/Cargo.toml"
strip = true
