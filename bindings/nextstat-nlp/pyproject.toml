[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextstat-nlp"
version = "0.2.1"
description = "Optional NLP/ETL plugin for NextStat: GLiNER2-based text-to-stats pipelines (survival, priors, regimens)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later OR LicenseRef-Commercial" }
authors = [{ name = "NextStat Contributors" }]
keywords = ["nextstat", "pharma", "survival", "priors", "nlp", "information-extraction", "gliner2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
gliner2 = ["gliner2>=1.2.0"]
onnx = ["gliner2-onnx>=0.1.1", "onnxruntime>=1.17.0"]
pandas = ["pandas>=2.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
