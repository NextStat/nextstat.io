name: Release Candidate

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_mode:
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ── Gate: test, lint, version check ──────────────────────────
  test:
    name: Pre-release validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate version matches tag
        shell: bash
        run: |
          RAW_TAG="${{ inputs.release_tag }}"
          if [[ -z "${RAW_TAG}" ]]; then
            echo "::error::workflow_call requires inputs.release_tag"
            exit 1
          fi
          if [[ "${RAW_TAG}" != v* ]]; then
            echo "::error::workflow_call release_tag must start with 'v' (got '${RAW_TAG}')"
            exit 1
          fi

          TAG="${RAW_TAG#v}"
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG" != "$CARGO_VER" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CARGO_VER"
            exit 1
          fi
          echo "Version $CARGO_VER matches tag v$TAG"

          # Validate Python package versions match the tag
          for toml in bindings/ns-py/pyproject.toml bindings/ns-cli-py/pyproject.toml; do
            PY_VER=$(grep '^version' "$toml" | head -1 | sed 's/.*"\(.*\)"/\1/')
            if [ "$TAG" != "$PY_VER" ]; then
              echo "::error::Tag v$TAG does not match $toml version $PY_VER"
              exit 1
            fi
            echo "$toml version $PY_VER matches tag v$TAG"
          done

          # Validate nextstat-cli pin in ns-py matches the tag
          CLI_PIN=$(grep 'nextstat-cli==' bindings/ns-py/pyproject.toml | sed 's/.*==\(.*\)".*/\1/')
          if [ "$TAG" != "$CLI_PIN" ]; then
            echo "::error::nextstat-cli pin ($CLI_PIN) in ns-py/pyproject.toml does not match tag v$TAG"
            exit 1
          fi
          echo "nextstat-cli pin $CLI_PIN matches tag v$TAG"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  gvm-stable-first:
    name: GVM Stable-First Gate
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install "maturin>=1.11,<2.0" "pytest>=9.0" "numpy>=2.0" "pyhf>=0.7.6" "jsonschema>=4.0" "pyarrow>=18.0" "polars>=1.0" "duckdb>=1.0"

      - name: Run stable-first GVM gate
        run: bash scripts/gvm/stable_first_gate.sh

  simplified-likelihood-stable-surface:
    name: Simplified Likelihood Stable-Surface Gate
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install "maturin>=1.11,<2.0" "pytest>=9.0" "numpy>=2.0" "pyhf>=0.7.6" "jsonschema>=4.0" "pyarrow>=18.0" "polars>=1.0" "duckdb>=1.0"

      - name: Run simplified-likelihood stable-surface gate
        run: bash scripts/benchmarks/simplified_likelihood_stable_surface_gate.sh

      - name: Upload simplified-likelihood promotion artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplified-likelihood-stable-surface-report
          path: |
            tmp/simplified-likelihood-stable-surface/apex2_simplified_likelihood_report.json
            tmp/simplified-likelihood-stable-surface/promotion_bundle/promotion_evidence.json
            tmp/simplified-likelihood-stable-surface/promotion_bundle/promotion_evidence_check.json
          if-no-files-found: error

  simplified-likelihood-exporter-surface:
    name: Simplified Likelihood Exporter Surface Gate
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install "maturin>=1.11,<2.0" "pytest>=9.0" "numpy>=2.0" "pyhf>=0.7.6" "jsonschema>=4.0"

      - name: Shellcheck (bash -n) exporter gate
        run: bash -n scripts/benchmarks/simplified_likelihood_exporter_surface_gate.sh

      - name: Run simplified-likelihood exporter gate
        run: make simplified-likelihood-exporter-surface-gate

      - name: Upload simplified-likelihood exporter artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplified-likelihood-exporter-surface-report
          path: |
            benchmarks/artifacts/simplified_likelihood_export_benchmarks/nextstat-bench/current/apex2_simplified_likelihood_report.json
            benchmarks/artifacts/simplified_likelihood_export_benchmarks/nextstat-bench/current/export_benchmark_snapshot_report.json
            benchmarks/artifacts/simplified_likelihood_export_benchmarks/nextstat-bench/current/export_public_validation_report.json
            benchmarks/artifacts/simplified_likelihood_export_benchmarks/nextstat-bench/current/snapshot_index.json
            benchmarks/artifacts/simplified_likelihood_exporter_promotion_bundles/nextstat-bench/accepted/promotion_evidence.json
            benchmarks/artifacts/simplified_likelihood_exporter_promotion_bundles/nextstat-bench/accepted/promotion_evidence_check.json
            benchmarks/artifacts/simplified_likelihood_exporter_promotion_bundles/nextstat-bench/accepted/promotion_bundle_promotion_report.json
            benchmarks/artifacts/simplified_likelihood_exporter_promotion_bundles/nextstat-bench/accepted/stable_review_assessment.json
            benchmarks/artifacts/simplified_likelihood_exporter_promotion_bundles/nextstat-bench/accepted/stable_evidence_policy.json
            benchmarks/artifacts/simplified_likelihood_exporter_promotion_bundles/nextstat-bench/accepted/stable_evidence_freshness_report.json
            benchmarks/artifacts/simplified_likelihood_exporter_promotion_bundles/nextstat-bench/accepted/stable_source_semantics_boundary.json
            benchmarks/artifacts/simplified_likelihood_exporter_promotion_bundles/nextstat-bench/accepted/stable_candidate_blocker_matrix.json
            benchmarks/artifacts/simplified_likelihood_exporter_promotion_bundles/nextstat-bench/accepted/stable_candidate_review_packet.json
            benchmarks/artifacts/simplified_likelihood_exporter_promotion_bundles/nextstat-bench/accepted/stable_promotion_decision.json
            benchmarks/artifacts/simplified_likelihood_exporter_promotion_bundles/nextstat-bench/accepted/snapshot_index.json
          if-no-files-found: error

  m15-reporting-stable-surface:
    name: M15 Reporting Stable-Surface Gate
    needs: [test]
    runs-on: ${{ fromJSON('["self-hosted","linux","x64","bench"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Shellcheck (bash -n) stable-surface gate
        run: bash -n scripts/benchmarks/m15_reporting_stable_surface_gate.sh

      - name: Run M15 reporting stable-surface gate
        run: make m15-reporting-stable-surface-gate

      - name: Upload M15 reporting benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m15-reporting-stable-surface-report
          path: |
            tmp/m15_reporting_stable_surface/m15_reporting_benchmark.json
            tmp/m15_reporting_stable_surface/m15_reporting_benchmark.md
            tmp/m15_reporting_stable_surface/m15_reporting_compare.json
          if-no-files-found: error

  histfactory-stable-surface:
    name: HistFactory Stable-Surface Gate
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install "maturin>=1.11,<2.0" "pytest>=9.0" "numpy>=2.0" "pyhf>=0.7.6" "pyarrow>=18.0"

      - name: Shellcheck (bash -n) gate script
        run: bash -n scripts/benchmarks/histfactory_stable_surface_gate.sh

      - name: Run HistFactory stable-surface gate
        run: make histfactory-stable-surface-gate

  hepdata-import-stable-surface:
    name: HEPData Import Stable-Surface Gate
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install "pytest>=9.0" "numpy>=2.0" "jsonschema>=4.0"

      - name: Run HEPData import CLI gate
        run: cargo test -q -p ns-cli --test cli_import_hepdata

      - name: Run HEPData schema smoke tests
        run: |
          PYTHONPATH=bindings/ns-py/python .venv/bin/python -m pytest -q \
            tests/python/test_hepdata_schema_smoke.py \
            tests/python/test_hepdata_import_benchmark_smoke.py

  # ── Python wheels (multi-arch) ───────────────────────────────
  # Builds wheels for every supported Python (3.11-3.14) on every platform.
  # Linux: manylinux_2_17 Docker container (has all interpreters pre-installed).
  # macOS/Windows: setup-python installs interpreters, --find-interpreter finds them.
  wheels:
    name: Wheel (${{ matrix.target }})
    needs: [test, gvm-stable-first, simplified-likelihood-stable-surface, simplified-likelihood-exporter-surface, m15-reporting-stable-surface, histfactory-stable-surface, hepdata-import-stable-surface]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python interpreters
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/ns-py
          target: ${{ matrix.target }}
          command: build
          args: --release --out dist --find-interpreter
          manylinux: "2_17"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: bindings/ns-py/dist/*.whl

  # ── Source distribution ──────────────────────────────────────
  sdist:
    name: Source distribution
    needs: [test, gvm-stable-first, simplified-likelihood-stable-surface, simplified-likelihood-exporter-surface, m15-reporting-stable-surface, histfactory-stable-surface, hepdata-import-stable-surface]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/ns-py
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/ns-py/dist/*.tar.gz

  # ── CLI Python wheels (maturin bindings=bin) ─────────────────
  # Produces py3-none-{platform} wheels — one per platform, no per-Python builds.
  cli-wheels:
    name: CLI wheel (${{ matrix.target }})
    needs: [test, gvm-stable-first, simplified-likelihood-stable-surface, simplified-likelihood-exporter-surface, m15-reporting-stable-surface, histfactory-stable-surface, hepdata-import-stable-surface]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CLI wheel
        uses: PyO3/maturin-action@v1
        env:
          # ring's aarch64 linux ASM expects __ARM_ARCH during manylinux cross builds.
          # Keep the workaround scoped to the failing target only.
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '-D__ARM_ARCH=8 -march=armv8-a' || '' }}
        with:
          working-directory: bindings/ns-cli-py
          target: ${{ matrix.target }}
          command: build
          args: --release --out dist
          manylinux: "2_17"

      - name: Upload CLI wheel
        uses: actions/upload-artifact@v4
        with:
          name: cli-wheels-${{ matrix.target }}
          path: bindings/ns-cli-py/dist/*.whl

  # ── CLI source distribution ────────────────────────────────
  cli-sdist:
    name: CLI source distribution
    needs: [test, gvm-stable-first, simplified-likelihood-stable-surface, simplified-likelihood-exporter-surface, m15-reporting-stable-surface, histfactory-stable-surface, hepdata-import-stable-surface]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CLI sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/ns-cli-py
          command: sdist
          args: --out dist

      - name: Upload CLI sdist
        uses: actions/upload-artifact@v4
        with:
          name: cli-sdist
          path: bindings/ns-cli-py/dist/*.tar.gz

  # ── CLI binaries (standalone, for GitHub Release) ───────────
  cli:
    name: CLI (${{ matrix.target }})
    needs: [test, gvm-stable-first, simplified-likelihood-stable-surface, simplified-likelihood-exporter-surface, m15-reporting-stable-surface, histfactory-stable-surface, hepdata-import-stable-surface]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI binary
        run: cargo build --release -p ns-cli --target ${{ matrix.target }}
        env:
          CARGO_TARGET_DIR: target

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/nextstat"
          if [ ! -f "$BIN" ]; then
            BIN="target/release/nextstat"
          fi
          cp "$BIN" dist/nextstat-${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/nextstat-*

  # ── Whitepaper PDF ───────────────────────────────────────────
  whitepaper:
    name: Whitepaper PDF
    needs: [test, gvm-stable-first, simplified-likelihood-stable-surface, m15-reporting-stable-surface, histfactory-stable-surface, hepdata-import-stable-surface]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ inputs.release_tag }}"
          VER="${VER#v}"
          python3 scripts/build_whitepaper.py --version "$VER"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: whitepaper
          path: dist/whitepaper/*

  # ── Validation Pack (Apex2 + workspace fingerprint) ──────────
  validation-pack:
    name: Validation Pack
    needs: [wheels, cli]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download wheel (linux x86_64)
        uses: actions/download-artifact@v4
        with:
          name: wheels-x86_64-unknown-linux-gnu
          path: dist

      - name: Download CLI (linux x86_64)
        uses: actions/download-artifact@v4
        with:
          name: cli-x86_64-unknown-linux-gnu
          path: dist

      - name: Install Python package + deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          WHEEL="$(find dist -name '*cp312*.whl' | head -n 1)"
          if [[ -z "${WHEEL}" ]]; then
            echo "::error::No .whl found under dist/"
            exit 1
          fi
          # Candidate validation must stay independent of PyPI propagation.
          # Install the locally built nextstat wheel only, and use the locally
          # downloaded standalone CLI binary instead of relying on nextstat-cli
          # from the package index.
          pip install --no-deps "${WHEEL}"
          pip install "pytest>=9.0" "numpy>=2.0" "pyhf>=0.7.6" "uproot>=5.0" "tqdm>=4.0" "matplotlib>=3.9" "python-docx>=1.1" "jsonschema>=4.0"

      - name: Render validation pack (JSON + PDF)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts artifacts2 artifacts_jsononly artifacts_m15 artifacts_m15_2
          NEXTSTAT_BIN="$(find dist -name 'nextstat-*' -type f ! -name '*.whl' | head -n 1)"
          if [[ -z "${NEXTSTAT_BIN}" ]]; then
            echo "::error::No nextstat CLI found under dist/"
            exit 1
          fi
          chmod +x "${NEXTSTAT_BIN}"
          set +e
          make validation-pack \
            VALIDATION_PACK_OUT_DIR=artifacts \
            VALIDATION_PACK_WORKSPACE=tests/fixtures/complex_workspace.json \
            VALIDATION_PACK_ARGS="--python python --nextstat-bin ${NEXTSTAT_BIN} --deterministic"
          MAKE_RC=$?
          set -e
          if [[ ! -f "artifacts/validation_report.json" ]]; then
            echo "::error::Validation report not generated (make rc=$MAKE_RC)"
            exit 1
          fi
          if [[ "$MAKE_RC" != "0" ]]; then
            echo "::warning::make validation-pack exited rc=$MAKE_RC but all outputs generated"
          fi

          # JSON-only smoke: render canonical Linux pharma evidence once, then
          # reuse it for the release-grade M15 pack. SAEM/FOCE internals are
          # not treated as cross-platform exact snapshot surfaces.
          make validation-pack \
            VALIDATION_PACK_OUT_DIR=artifacts_jsononly \
            VALIDATION_PACK_WORKSPACE=tests/fixtures/simple_workspace.json \
            VALIDATION_PACK_ARGS="--python python --nextstat-bin ${NEXTSTAT_BIN} --deterministic --json-only"
          if [[ ! -f artifacts_jsononly/pharma_validation.json ]]; then
            echo "::error::M15 release path requires artifacts_jsononly/pharma_validation.json"
            exit 1
          fi
          cp artifacts_jsononly/pharma_validation.json artifacts_m15/pharma_validation.json
          make validation-pack \
            VALIDATION_PACK_OUT_DIR=artifacts_m15 \
            VALIDATION_PACK_WORKSPACE=tests/fixtures/simple_workspace.json \
            VALIDATION_PACK_M15_CONFIG=docs/specs/m15_config_v1.example.json \
            VALIDATION_PACK_ARGS="--apex2-master artifacts_jsononly/apex2_master_report.json --python python --nextstat-bin ${NEXTSTAT_BIN} --deterministic --skip-pharma-validation"

      - name: Validate validation report schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path("docs/schemas/validation/validation_report_v1.schema.json").read_text())
          inst = json.loads(Path("artifacts/validation_report.json").read_text())
          jsonschema.validate(inst, schema)
          print("validation_report_v1: schema ok")
          PY

      - name: Validate M15 bundle manifest schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path("docs/schemas/validation/m15_bundle_manifest_v1.schema.json").read_text())
          inst = json.loads(Path("artifacts_m15/m15_bundle_manifest.json").read_text())
          jsonschema.validate(inst, schema)
          print("m15_bundle_manifest_v1: schema ok")
          PY

      - name: Validate M15 profile diff schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path("docs/schemas/validation/m15_profile_diff_report_v1.schema.json").read_text())
          inst = json.loads(Path("artifacts_m15/m15_profile_diff_report.json").read_text())
          jsonschema.validate(inst, schema)
          print("m15_profile_diff_report_v1: schema ok")
          PY

      - name: Compare validation pack determinism (Apex2 master input)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts2
          NEXTSTAT_BIN="$(find dist -name 'nextstat-*' -type f ! -name '*.whl' | head -n 1)"
          chmod +x "${NEXTSTAT_BIN}"

          # Re-render using the exact Apex2 master JSON output and ensure JSON+PDF+manifest are bit-identical.
          # Copy canonical Linux pharma evidence from the first render. FOCE/SAEM
          # is release-grade on the canonical Linux runner, but not a required
          # cross-platform exact rerender surface.
          if [[ -f artifacts/pharma_validation.json ]]; then
            cp artifacts/pharma_validation.json artifacts2/pharma_validation.json
          fi
          set +e
          make validation-pack \
            VALIDATION_PACK_OUT_DIR=artifacts2 \
            VALIDATION_PACK_WORKSPACE=tests/fixtures/complex_workspace.json \
            VALIDATION_PACK_ARGS="--apex2-master artifacts/apex2_master_report.json --python python --nextstat-bin ${NEXTSTAT_BIN} --deterministic --skip-pharma-validation"
          MAKE_RC=$?
          set -e
          if [[ ! -f "artifacts2/validation_report.json" ]]; then
            echo "::error::Determinism re-render failed (make rc=$MAKE_RC)"
            exit 1
          fi
          if [[ "$MAKE_RC" != "0" ]]; then
            echo "::warning::make validation-pack (determinism) exited rc=$MAKE_RC but outputs generated"
          fi

          sha256sum artifacts/validation_report.json artifacts2/validation_report.json
          sha256sum artifacts/validation_report.pdf artifacts2/validation_report.pdf
          sha256sum artifacts/validation_pack_manifest.json artifacts2/validation_pack_manifest.json

          test "$(sha256sum artifacts/validation_report.json | awk '{print $1}')" = "$(sha256sum artifacts2/validation_report.json | awk '{print $1}')"
          test "$(sha256sum artifacts/validation_report.pdf | awk '{print $1}')" = "$(sha256sum artifacts2/validation_report.pdf | awk '{print $1}')"
          test "$(sha256sum artifacts/validation_pack_manifest.json | awk '{print $1}')" = "$(sha256sum artifacts2/validation_pack_manifest.json | awk '{print $1}')"

      - name: Compare M15 validation pack determinism (Apex2 master input)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts_m15_2
          NEXTSTAT_BIN="$(find dist -name 'nextstat-*' -type f ! -name '*.whl' | head -n 1)"
          chmod +x "${NEXTSTAT_BIN}"

          cp artifacts_m15/pharma_validation.json artifacts_m15_2/pharma_validation.json
          make validation-pack \
            VALIDATION_PACK_OUT_DIR=artifacts_m15_2 \
            VALIDATION_PACK_WORKSPACE=tests/fixtures/simple_workspace.json \
            VALIDATION_PACK_M15_CONFIG=docs/specs/m15_config_v1.example.json \
            VALIDATION_PACK_ARGS="--apex2-master artifacts_jsononly/apex2_master_report.json --python python --nextstat-bin ${NEXTSTAT_BIN} --deterministic --skip-pharma-validation"

          sha256sum artifacts_m15/validation_report.json artifacts_m15_2/validation_report.json
          sha256sum artifacts_m15/validation_report.pdf artifacts_m15_2/validation_report.pdf
          sha256sum artifacts_m15/m15_assessment_table.json artifacts_m15_2/m15_assessment_table.json
          sha256sum artifacts_m15/m15_map.json artifacts_m15_2/m15_map.json
          sha256sum artifacts_m15/m15_mar.json artifacts_m15_2/m15_mar.json
          sha256sum artifacts_m15/m15_profile_diff_report.json artifacts_m15_2/m15_profile_diff_report.json
          sha256sum artifacts_m15/m15_report.md artifacts_m15_2/m15_report.md
          sha256sum artifacts_m15/m15_report.pdf artifacts_m15_2/m15_report.pdf
          sha256sum artifacts_m15/m15_report.docx artifacts_m15_2/m15_report.docx
          sha256sum artifacts_m15/m15_bundle_manifest.json artifacts_m15_2/m15_bundle_manifest.json
          sha256sum artifacts_m15/validation_pack_manifest.json artifacts_m15_2/validation_pack_manifest.json

          test "$(sha256sum artifacts_m15/validation_report.json | awk '{print $1}')" = "$(sha256sum artifacts_m15_2/validation_report.json | awk '{print $1}')"
          test "$(sha256sum artifacts_m15/validation_report.pdf | awk '{print $1}')" = "$(sha256sum artifacts_m15_2/validation_report.pdf | awk '{print $1}')"
          test "$(sha256sum artifacts_m15/m15_assessment_table.json | awk '{print $1}')" = "$(sha256sum artifacts_m15_2/m15_assessment_table.json | awk '{print $1}')"
          test "$(sha256sum artifacts_m15/m15_map.json | awk '{print $1}')" = "$(sha256sum artifacts_m15_2/m15_map.json | awk '{print $1}')"
          test "$(sha256sum artifacts_m15/m15_mar.json | awk '{print $1}')" = "$(sha256sum artifacts_m15_2/m15_mar.json | awk '{print $1}')"
          test "$(sha256sum artifacts_m15/m15_profile_diff_report.json | awk '{print $1}')" = "$(sha256sum artifacts_m15_2/m15_profile_diff_report.json | awk '{print $1}')"
          test "$(sha256sum artifacts_m15/m15_report.md | awk '{print $1}')" = "$(sha256sum artifacts_m15_2/m15_report.md | awk '{print $1}')"
          test "$(sha256sum artifacts_m15/m15_report.pdf | awk '{print $1}')" = "$(sha256sum artifacts_m15_2/m15_report.pdf | awk '{print $1}')"
          test "$(sha256sum artifacts_m15/m15_report.docx | awk '{print $1}')" = "$(sha256sum artifacts_m15_2/m15_report.docx | awk '{print $1}')"
          test "$(sha256sum artifacts_m15/m15_bundle_manifest.json | awk '{print $1}')" = "$(sha256sum artifacts_m15_2/m15_bundle_manifest.json | awk '{print $1}')"
          test "$(sha256sum artifacts_m15/validation_pack_manifest.json | awk '{print $1}')" = "$(sha256sum artifacts_m15_2/validation_pack_manifest.json | awk '{print $1}')"

      - name: Write validation pack integrity artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validation/write_manifest_digest.py \
            --manifest artifacts/validation_pack_manifest.json
          python3 scripts/validation/write_manifest_digest.py \
            --manifest artifacts_m15/m15_bundle_manifest.json

          python3 scripts/benchmarks/write_snapshot_index.py \
            --suite release-validation-pack \
            --artifacts-dir artifacts \
            --out artifacts/snapshot_index.json
          python3 scripts/benchmarks/write_snapshot_index.py \
            --suite release-validation-pack-m15 \
            --artifacts-dir artifacts_m15 \
            --out artifacts_m15/m15_snapshot_index.json

      - name: Upload validation pack
        uses: actions/upload-artifact@v4
        with:
          name: validation-pack
          path: |
            artifacts/*
            artifacts_m15/*

  release-manifest:
    name: Release Candidate Manifest
    needs:
      [
        test,
        gvm-stable-first,
        simplified-likelihood-stable-surface,
        simplified-likelihood-exporter-surface,
        m15-reporting-stable-surface,
        histfactory-stable-surface,
        hepdata-import-stable-surface,
        wheels,
        cli,
        sdist,
        cli-wheels,
        cli-sdist,
        whitepaper,
        validation-pack,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render release surface matrix report
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.release_surface_matrix \
            --out-json tmp/release_surface_matrix_report.json \
            --out-md tmp/release_surface_matrix_report.md

      - name: Render release manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.release_manifest \
            --release-tag "${{ inputs.release_tag }}" \
            --mode "${{ inputs.release_mode }}" \
            --out-json tmp/release_manifest.json \
            --out-md tmp/release_manifest.md

      - name: Validate HEP surface matrix (141/141 stable)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hep_surface_matrix.py --check
          python3 -m scripts.hep_validation_bundle --check

      - name: Build HEP validation bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.hep_validation_bundle \
            --out-json tmp/hep_validation_bundle.json \
            --out-md tmp/hep_validation_bundle.md

      - name: Build release candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.release_candidate_bundle \
            --release-tag "${{ inputs.release_tag }}" \
            --mode "${{ inputs.release_mode }}" \
            --surface-report-json tmp/release_surface_matrix_report.json \
            --surface-report-md tmp/release_surface_matrix_report.md \
            --release-manifest-json tmp/release_manifest.json \
            --release-manifest-md tmp/release_manifest.md \
            --out-dir tmp/release_candidate_bundle

      - name: Upload release candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-bundle
          path: |
            tmp/release_candidate_bundle/*
            docs/schemas/releases/release_candidate_bundle_v1.schema.json
            docs/schemas/releases/release_manifest_v1.schema.json

      - name: Upload HEP validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: hep-validation-bundle
          path: |
            tmp/hep_validation_bundle.json
            tmp/hep_validation_bundle.md
