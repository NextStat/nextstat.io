name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-candidate:
    name: Release Candidate
    uses: ./.github/workflows/release-candidate.yml
    with:
      release_tag: ${{ github.ref_name }}
      release_mode: publish

  crates-io-publish:
    name: Publish to crates.io
    needs: [release-candidate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish workspace crates (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Not a tag push; skipping crates.io publish."
            exit 0
          fi
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "Missing CARGO_REGISTRY_TOKEN secret; skipping crates.io publish."
            exit 0
          fi
          publish() {
            local crate="$1"
            echo "Publishing ${crate}…"
            cargo publish -p "${crate}"
            sleep 20
          }

          publish ns-core
          publish ns-compute
          publish ns-ad
          publish ns-prob
          publish ns-translate
          publish ns-inference
          publish ns-viz
          publish ns-cli

  github-release:
    name: GitHub Release
    needs: [release-candidate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Extract CHANGELOG section
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          BODY=$(awk -v ver="$TAG" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") || index($0, "[Unreleased]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release v${TAG}"
          fi
          echo "$BODY" > /tmp/release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
          files: |
            dist/**/*.whl
            dist/**/*.tar.gz
            dist/cli-*/nextstat-*
            dist/**/release_candidate_bundle_manifest.json
            dist/**/release_candidate_bundle_manifest.md
            dist/**/release_manifest.json
            dist/**/release_manifest.md
            dist/**/release_manifest_v1.schema.json
            dist/**/nextstat-whitepaper-*.pdf
            dist/**/nextstat-whitepaper-*.pdf.sha256
            dist/**/apex2_master_report.json
            dist/**/validation_report.json
            dist/**/validation_report.pdf
            dist/**/validation_report_v1.schema.json
            dist/**/validation_pack_manifest.json
            dist/**/validation_pack_manifest.sha256
            dist/**/validation_pack_manifest.sha256.bin
            dist/**/snapshot_index.json
            dist/**/m15_config.json
            dist/**/m15_assessment_table.json
            dist/**/m15_map.json
            dist/**/m15_mar.json
            dist/**/m15_profile_diff_report.json
            dist/**/m15_profile_diff_report_v1.schema.json
            dist/**/m15_report.md
            dist/**/m15_report.pdf
            dist/**/m15_report.docx
            dist/**/m15_bundle_manifest.json
            dist/**/m15_bundle_manifest_v1.schema.json
            dist/**/m15_bundle_manifest.sha256
            dist/**/m15_bundle_manifest.sha256.bin
            dist/**/m15_snapshot_index.json
            dist/**/m15_reporting_benchmark.json
            dist/**/m15_reporting_benchmark.md
            dist/**/m15_reporting_compare.json
            dist/**/apex2_simplified_likelihood_report.json
            dist/**/export_benchmark_snapshot_report.json
            dist/**/export_public_validation_report.json
            dist/**/promotion_evidence.json
            dist/**/promotion_evidence_check.json
            dist/**/promotion_bundle_promotion_report.json
            dist/**/stable_review_assessment.json
            dist/**/stable_evidence_policy.json
            dist/**/stable_evidence_freshness_report.json
            dist/**/stable_source_semantics_boundary.json
            dist/**/stable_candidate_blocker_matrix.json
            dist/**/stable_candidate_review_packet.json
            dist/**/stable_promotion_decision.json

  pypi-publish-cli:
    name: Publish nextstat-cli to PyPI
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi-cli
    permissions:
      id-token: write
    steps:
      - name: Download CLI wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cli-wheels-*
          path: dist
          merge-multiple: true

      - name: Download CLI sdist
        uses: actions/download-artifact@v4
        with:
          name: cli-sdist
          path: dist

      - name: Publish nextstat-cli to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  pypi-publish:
    name: Publish nextstat to PyPI
    needs: [github-release, pypi-publish-cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Wait for nextstat-cli to propagate on PyPI
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Waiting for nextstat-cli==$TAG to appear on PyPI..."
          for i in $(seq 1 30); do
            if pip index versions nextstat-cli 2>/dev/null | grep -q "$TAG"; then
              echo "nextstat-cli==$TAG is available on PyPI"
              exit 0
            fi
            echo "Attempt $i/30 — not yet available, waiting 10s..."
            sleep 10
          done
          echo "::warning::nextstat-cli==$TAG not found after 5 min — publishing nextstat anyway"

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish nextstat to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
