name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-candidate:
    name: Release Candidate
    uses: ./.github/workflows/release-candidate.yml
    with:
      release_tag: ${{ github.ref_name }}
      release_mode: publish

  crates-io-publish:
    name: Publish to crates.io
    needs: [release-candidate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish workspace crates (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Not a tag push; skipping crates.io publish."
            exit 0
          fi
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "Missing CARGO_REGISTRY_TOKEN secret; skipping crates.io publish."
            exit 0
          fi
          publish() {
            local crate="$1"
            echo "Publishing ${crate}…"
            cargo publish -p "${crate}"
            sleep 20
          }

          publish ns-core
          publish ns-compute
          publish ns-ad
          publish ns-prob
          publish ns-translate
          publish ns-inference
          publish ns-viz
          publish ns-cli

  github-release:
    name: GitHub Release
    needs: [release-candidate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Extract CHANGELOG section
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          BODY=$(awk -v ver="$TAG" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") || index($0, "[Unreleased]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release v${TAG}"
          fi
          echo "$BODY" > /tmp/release_notes.md

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.release_stage_assets --dist-root dist --out-dir dist/release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
          files: dist/release-assets/*

  pypi-publish-cli:
    name: Publish nextstat-cli to PyPI
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi-cli
    permissions:
      id-token: write
    steps:
      - name: Download CLI release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --pattern 'nextstat_cli-*.whl' \
            --pattern 'nextstat_cli-*.tar.gz' \
            --dir dist

      - name: Validate CLI release publish artifacts
        run: |
          python3 -m scripts.validate_release_publish_artifacts \
            --dir dist \
            --package-prefix nextstat_cli

      - name: Publish nextstat-cli to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  pypi-publish:
    name: Publish nextstat to PyPI
    needs: [github-release, pypi-publish-cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Wait for nextstat-cli to propagate on PyPI
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Waiting for nextstat-cli==$TAG to appear on PyPI..."
          for i in $(seq 1 30); do
            if pip index versions nextstat-cli 2>/dev/null | grep -q "$TAG"; then
              echo "nextstat-cli==$TAG is available on PyPI"
              exit 0
            fi
            echo "Attempt $i/30 — not yet available, waiting 10s..."
            sleep 10
          done
          echo "::warning::nextstat-cli==$TAG not found after 5 min — publishing nextstat anyway"

      - name: Download nextstat release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --pattern 'nextstat-*.whl' \
            --pattern 'nextstat-*.tar.gz' \
            --dir dist

      - name: Validate nextstat release publish artifacts
        run: |
          python3 -m scripts.validate_release_publish_artifacts \
            --dir dist \
            --package-prefix nextstat

      - name: Publish nextstat to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
